# Copy this file to secrets.toml and replace every placeholder.
# Never commit secrets.toml.

[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "replace-with-a-long-random-secret"

[auth.google]
client_id = "replace-with-google-client-id"
client_secret = "replace-with-google-client-secret"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[auth.microsoft]
# For personal Microsoft accounts, use the consumer tenant endpoint.
# If using a work/school account instead, switch to your tenant-specific URL.
client_id = "replace-with-microsoft-client-id"
client_secret = "replace-with-microsoft-client-secret"
server_metadata_url = "https://login.microsoftonline.com/consumers/v2.0/.well-known/openid-configuration"

[app]
host_emails = ["rishikganiv@gmail.com"]

