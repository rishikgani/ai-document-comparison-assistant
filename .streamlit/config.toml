[theme]
base = "light"
primaryColor = "#3157D5"
backgroundColor = "#F5F7FC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
font = "sans-serif"
headingFont = "sans-serif"
baseRadius = "0.65rem"
buttonRadius = "0.55rem"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "2rem"
paddingBottom = "2.5rem"
linkUnderline = false

[theme.sidebar]
backgroundColor = "#EEF2FF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2937"
borderColor = "#D9E1F0"
primaryColor = "#3157D5"

[server]
# Allow other devices on the same local network to open the app.
address = "0.0.0.0"
# Cloud hosts should run without trying to open a local browser.
headless = true
port = 8501
